<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rừng Dưới Ánh Trăng - Real Trees</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --forest-bg: #050810;
            --moon-glow: #fef9e7;
            --moon-core: #fffef5;
            --star-light: #e8f4f8;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            background: var(--forest-bg);
            color: var(--moon-glow);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* --- BẦU TRỜI --- */
        .sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    #02040a 0%,
                    #0d1b2a 40%,
                    #1b263b 80%,
                    #1f3a3d 100%);
            z-index: 1;
            pointer-events: none;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: var(--star-light);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- MẶT TRĂNG (Tương tác cũ) --- */
        .moon-container {
            position: fixed;
            top: 15%;
            right: 20%;
            width: 180px;
            height: 180px;
            z-index: 3;
            touch-action: none; 
            cursor: grab;
        }
        
        .moon-container:active { cursor: grabbing; }

        .moon {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%,
                    var(--moon-core) 0%,
                    var(--moon-glow) 40%,
                    rgba(254, 249, 231, 0.6) 70%,
                    transparent 100%);
            border-radius: 50%;
            box-shadow:
                0 0 60px rgba(254, 249, 231, 0.6),
                0 0 120px rgba(254, 249, 231, 0.3),
                inset -20px -20px 40px rgba(0, 0, 0, 0.1);
            animation: moonGlow 6s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes moonGlow {
            0%, 100% { box-shadow: 0 0 60px rgba(254, 249, 231, 0.6); }
            50% { box-shadow: 0 0 100px rgba(254, 249, 231, 0.8); }
        }

        /* --- RỪNG CÂY ẢNH THẬT (NEW) --- */
        .forest-layer {
            position: fixed;
            bottom: -5%; /* Giấu phần chân ảnh một chút */
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .tree-img {
            position: absolute;
            bottom: 0;
            width: 110%; /* Rộng hơn màn hình để khi lắc không bị hở mép */
            left: -5%;
            object-fit: cover;
            transform-origin: bottom center; /* Quan trọng: Xoay từ gốc cây */
        }

        /* Lớp cây xa: Mờ, tối, chuyển động chậm */
        .tree-back {
            height: 60vh;
            filter: brightness(0.15) blur(1px);
            z-index: 1;
            animation: windSway 8s ease-in-out infinite alternate;
            opacity: 0.9;
        }

        /* Lớp cây giữa: Rõ hơn, chuyển động vừa */
        .tree-mid {
            height: 75vh;
            filter: brightness(0.1);
            z-index: 2;
            animation: windSway 6s ease-in-out infinite alternate-reverse; 
            /* reverse để lắc ngược chiều cây sau cho tự nhiên */
        }

        /* Lớp cây gần: Đen tuyền, chi tiết, chuyển động nhiều hơn */
        .tree-front {
            height: 90vh; /* Cao gần hết màn hình */
            filter: brightness(0); /* Đen hoàn toàn (silhouette) */
            z-index: 3;
            animation: windSwayFront 5s ease-in-out infinite alternate;
        }

        /* Hiệu ứng gió thổi (Cây nghiêng qua lại) */
        @keyframes windSway {
            0% { transform: rotate(0deg) translateX(0); }
            100% { transform: rotate(1deg) translateX(10px); }
        }

        @keyframes windSwayFront {
            0% { transform: rotate(-0.5deg) scale(1); }
            100% { transform: rotate(0.5deg) scale(1.02); }
        }

        .mist {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 40vh;
            background: linear-gradient(to top, rgba(200, 220, 230, 0.1) 0%, transparent 100%);
            z-index: 5;
            animation: mistFlow 20s infinite linear;
            pointer-events: none;
        }

        /* --- NỘI DUNG VÀ UI --- */
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 2rem;
            text-align: center;
            pointer-events: none;
        }

        .title, .poetry, .signature, .music-control {
            pointer-events: auto;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(254, 249, 231, 0.5);
            animation: fadeInDown 2s ease-out;
        }

        .poetry {
            background: rgba(5, 15, 20, 0.5); /* Nền tối mờ để chữ nổi trên cây */
            backdrop-filter: blur(4px);
            padding: 30px;
            border-radius: 15px;
            max-width: 650px;
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            line-height: 1.8;
            font-weight: 300;
            font-style: italic;
            opacity: 0;
            animation: fadeIn 3s ease-out 1s forwards;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .signature {
            margin-top: 2rem;
            opacity: 0;
            animation: fadeIn 2s ease-out 3s forwards;
        }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .music-control {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            z-index: 100;
            background: rgba(26, 61, 46, 0.6);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .music-control:hover { background: rgba(26, 61, 46, 0.9); }
        
        /* Fireflies */
        .firefly {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
            z-index: 6;
            animation: floatFirefly 10s infinite;
            pointer-events: none;
        }
        @keyframes floatFirefly {
            0% { transform: translate(0, 0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50px, -100px); opacity: 0; }
        }

    </style>
</head>

<body>
    <div class="sky"></div>
    <div class="stars" id="stars"></div>

    <!-- MẶT TRĂNG (Kéo thả + Zoom) -->
    <div class="moon-container" id="moon">
        <div class="moon"></div>
    </div>

    <!-- RỪNG CÂY (ẢNH THẬT + ANIMATION) -->
    <div class="forest-layer">

    <!-- Layer xa -->
    <img src="https://www.pikpng.com/pngl/m/28-287121_forest-silhouette-png-forest-silhouette-transparent-background-clipart.png"
         class="tree-img tree-back">

    <!-- Layer giữa -->
    <img src="https://www.kindpng.com/picc/m/691-6910492_forest-silhouette-png-transparent-png.png"
         class="tree-img tree-mid">

    <!-- Layer gần -->
    <img src="https://www.kindpng.com/picc/m/691-6910475_forest-silhouette-png-transparent-png.png"
         class="tree-img tree-front">

    </div>

    <div class="mist"></div>
    <div id="fireflies"></div>

    <div class="content">
        <h1 class="title">Rừng Đêm</h1>
        <div class="poetry">
            <p>
                Gió đêm nay thổi qua những tán thông già,<br>
                Mang theo hơi lạnh và nỗi nhớ về em.<br>
                Cây cối nghiêng mình như muốn thì thầm,<br>
                Rằng dưới ánh trăng này, anh vẫn đợi.<br>
                <br>
                (Hãy thử chạm vào mặt trăng, kéo nó lại gần,<br>
                để thấy rừng cây chuyển động theo từng nhịp thở...)
            </p>
        </div>
        <div class="signature">✦ Forever ✦</div>
    </div>

    <div class="music-control" id="musicControl">
        <span>♫</span> <span id="musicText">Phát nhạc</span>
    </div>
    <audio id="bgMusic" loop>
        <source src="demo/music/sm.mp3" type="audio/mpeg">
    </audio>

    <script>
        // JS: Stars & Fireflies
        const createParticles = (id, count, className) => {
            const container = document.getElementById(id);
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = className;
                el.style.left = Math.random() * 100 + '%';
                el.style.top = Math.random() * 100 + '%';
                el.style.animationDelay = Math.random() * 5 + 's';
                el.style.animationDuration = Math.random() * 5 + 5 + 's';
                container.appendChild(el);
            }
        };
        createParticles('stars', 150, 'star');
        createParticles('fireflies', 20, 'firefly');

        // JS: Moon Interaction (Drag & Zoom)
        const moon = document.getElementById('moon');
        let state = { scale: 1, panning: false, pointX: 0, pointY: 0, startX: 0, startY: 0, cssX: 0, cssY: 0 };

        function updateTransform() {
            moon.style.transform = `translate(${state.cssX}px, ${state.cssY}px) scale(${state.scale})`;
        }

        // Mouse Events
        moon.addEventListener('mousedown', e => {
            e.preventDefault(); state.panning = true;
            state.startX = e.clientX - state.cssX; state.startY = e.clientY - state.cssY;
            moon.style.cursor = 'grabbing';
        });
        window.addEventListener('mouseup', () => { state.panning = false; moon.style.cursor = 'grab'; });
        window.addEventListener('mousemove', e => {
            if (!state.panning) return;
            e.preventDefault();
            state.cssX = e.clientX - state.startX; state.cssY = e.clientY - state.startY;
            updateTransform();
        });
        moon.addEventListener('wheel', e => {
            e.preventDefault();
            const xs = (e.deltaY > 0) ? 0.9 : 1.1;
            state.scale = Math.min(Math.max(state.scale * xs, 0.5), 5);
            updateTransform();
        });

        // Touch Events
        let initDist = null, initScale = 1;
        moon.addEventListener('touchstart', e => {
            if (e.touches.length === 1) {
                state.panning = true;
                state.startX = e.touches[0].clientX - state.cssX;
                state.startY = e.touches[0].clientY - state.cssY;
            } else if (e.touches.length === 2) {
                state.panning = false;
                initDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                initScale = state.scale;
            }
        }, { passive: false });
        
        window.addEventListener('touchend', () => { state.panning = false; initDist = null; });
        window.addEventListener('touchmove', e => {
            if (e.touches.length === 1 && state.panning) {
                state.cssX = e.touches[0].clientX - state.startX;
                state.cssY = e.touches[0].clientY - state.startY;
                updateTransform();
            } else if (e.touches.length === 2 && initDist) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                state.scale = Math.min(Math.max(initScale * (dist / initDist), 0.5), 5);
                updateTransform();
            }
        }, { passive: false });

        // Music
        const musicBtn = document.getElementById('musicControl');
        const audio = document.getElementById('bgMusic');
        let playing = false;
        musicBtn.addEventListener('click', () => {
            playing ? audio.pause() : audio.play().catch(console.error);
            playing = !playing;
            document.getElementById('musicText').innerText = playing ? 'Đang phát...' : 'Phát nhạc';
        });
    </script>
</body>

</html>
